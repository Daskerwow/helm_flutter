name: helm_flutter
description: >-
  Лёгкая, предсказуемая библиотека управления состоянием для Dart и Flutter:
  явные исходы диспатча, отменяемые асинхронные команды, синхронная
  публикация изменений без Stream-накладных расходов.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  helm_core:
    git:
      url: https://github.com/Daskerwow/helm_core.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.1
